# Zonas de límite para las rutas públicas (/api/publico/).
# En la VM va en: /etc/nginx/conf.d/limites-publico.conf
#
# Las peticiones OPTIONS (comprobaciones del navegador) no se cuentan:
# la clave queda vacía y nginx no las limita.

map $request_method $clave_publico {
    default $binary_remote_addr;
    OPTIONS "";
}

limit_req_zone $clave_publico zone=publico:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;

