# Define los límites una sola vez arriba en tu nginx.conf principal
# limit_req_zone $binary_remote_addr zone=publico:10m rate=1r/s;
# limit_conn_zone $binary_remote_addr zone=conexiones:10m;

server {
    listen 443 ssl;
    server_name tu-dominio.com; # ⚠️ CAMBIA ESTO

    # Rutas genéricas de Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/tu-dominio.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.duckdns.org/privkey.pem;

    # Cabeceras proxy globales para todas las rutas
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Frontend / Aplicación Principal (Soporta WebSockets)
    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Optimización para streaming/EventSource si es necesario
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # API Pública con Rate Limit
    location /api/publico/ {
        limit_req zone=publico burst=2 nodelay;
        limit_req_status 429;
        limit_conn conexiones 2;
        client_max_body_size 4k;
        proxy_read_timeout 30s;
        
        proxy_pass http://127.0.0;
    }

    # API Privada / General
    location /api/ {
        proxy_pass http://127.0.0;
    }
}
