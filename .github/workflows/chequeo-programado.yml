name: Chequeo programado de sitios

on:
  schedule:
    - cron: '0 8 * * *'     # una vez al día, a las 8am UTC     - cron: '*/15 * * * *'  # cada 15 minutos
  workflow_dispatch:

jobs:
  ejecutar-chequeo:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de chequeo masivo
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -X POST https://consigueventas.duckdns.org/api/chequeos/ejecutar-todos \
            -H "X-Cron-Key: $CRON_SECRET" \
            --fail \
            --silent \
            --show-error
