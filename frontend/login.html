<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · Monitor ConsigueVentas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(900px 500px at 15% 0%, rgba(103, 212, 193, .10), transparent 60%),
        radial-gradient(700px 500px at 100% 100%, rgba(103, 212, 193, .06), transparent 60%),
        #0f1420;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }
    .login-caja {
      width: 100%; max-width: 400px; padding: 36px 32px 28px;
      border-radius: 18px; background: rgba(23, 29, 43, .92);
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    }
    .login-marca { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .login-marca img { width: 48px; height: 48px; border-radius: 12px; }
    .login-marca span { font-weight: 600; font-size: .9rem; color: #9aa6bd; line-height: 1.35; }
    .login-caja h1 { font-size: 1.6rem; margin: 0 0 6px; font-weight: 800; }
    .login-sub { color: #8b97ad; font-size: .92rem; margin: 0 0 24px; }
    .campo { margin-bottom: 16px; }
    .campo label { display: block; font-size: .8rem; font-weight: 600; color: #aab4c8; margin-bottom: 6px; }
    .campo input {
      width: 100%; box-sizing: border-box; padding: 13px 14px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .12); background: #0f1420; color: #f1f5f9;
      font: inherit; font-size: 1rem; transition: border-color .15s, box-shadow .15s;
    }
    .campo input:focus { outline: none; border-color: #67d4c1; box-shadow: 0 0 0 3px rgba(103, 212, 193, .18); }
    .campo-pass { position: relative; }
    .campo-pass input { padding-right: 48px; }
    .ver-pass {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; border-radius: 8px; color: #8b97ad; cursor: pointer; box-shadow: none;
    }
    .ver-pass:hover { color: #67d4c1; background: transparent; }
    #btn-login { width: 100%; padding: 13px; font-size: 1rem; font-weight: 700; margin-top: 4px; }
    #btn-login:disabled { opacity: .75; cursor: wait; }
    .spinner {
      display: inline-block; width: 14px; height: 14px; margin-right: 8px; vertical-align: -2px;
      border: 2px solid rgba(0, 0, 0, .25); border-top-color: #0f1420; border-radius: 50%;
      animation: giro .7s linear infinite;
    }
    @keyframes giro { to { transform: rotate(360deg); } }
    .login-error {
      display: none; margin-top: 16px; padding: 10px 12px; border-radius: 10px; font-size: .88rem;
      background: rgba(248, 113, 113, .10); border: 1px solid rgba(248, 113, 113, .35); color: #fca5a5;
    }
    .login-error.visible { display: block; }
    .login-pie { margin-top: 22px; text-align: center; color: #6b7890; font-size: .78rem; }
  </style>
</head>
<body>
  <main class="login-caja">
    <div class="login-marca">
      <img src="assets/img/logo.png" alt="ConsigueVentas">
      <span>Monitor de sitios web<br>ConsigueVentas</span>
    </div>

    <h1>Bienvenido</h1>
    <p class="login-sub">Ingresa con tu cuenta autorizada para ver el estado de los sitios.</p>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="username" autofocus>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <div class="campo-pass">
          <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password">
          <button type="button" class="ver-pass" id="ver-pass" aria-label="Mostrar contraseña">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" id="btn-login">Ingresar</button>
      <div class="login-error" id="login-error" role="alert"></div>
    </form>

    <div class="login-pie">Acceso restringido · ¿Sin acceso? Contacta al administrador</div>
  </main>

  <script src="assets/js/auth.js"></script>
  <script>
    if (leerSesion()) window.location.href = "dashboard.html";

    const inputPass = document.getElementById("password");
    document.getElementById("ver-pass").addEventListener("click", () => {
      const oculto = inputPass.type === "password";
      inputPass.type = oculto ? "text" : "password";
    });

    const btn = document.getElementById("btn-login");
    const cajaError = document.getElementById("login-error");

    function mostrarError(texto) {
      cajaError.textContent = texto;
      cajaError.classList.add("visible");
    }

    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      cajaError.classList.remove("visible");

      const email = document.getElementById("email").value.trim();
      const password = inputPass.value;
      if (!email || !password) {
        mostrarError("Escribe tu correo y tu contraseña.");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Verificando...';
      try {
        await iniciarSesion(email, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        mostrarError(err.message);
        btn.disabled = false;
        btn.textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>
