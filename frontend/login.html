<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar · Monitor ConsigueVentas</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .login-caja { max-width: 380px; margin: 12vh auto; padding: 32px; border-radius: 16px;
      background: #171d2b; border: 1px solid rgba(255,255,255,.08); }
    .login-caja img { height: 48px; margin-bottom: 16px; }
    .login-caja h1 { font-size: 1.4rem; margin: 0 0 20px; }
    .login-caja input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 12px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,.15); background: #0f1420; color: inherit; font: inherit; }
    .login-caja button { width: 100%; }
    #login-error { color: #f87171; min-height: 1.2em; margin-top: 12px; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="login-caja">
    <img src="assets/img/logo.png" alt="ConsigueVentas">
    <h1>Ingresar al monitor</h1>
    <form id="form-login">
      <input type="email" id="email" placeholder="Correo" required autocomplete="username">
      <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password">
      <button type="submit" id="btn-login">Ingresar</button>
    </form>
    <div id="login-error"></div>
  </div>

  <script src="assets/js/auth.js"></script>
  <script>
    if (leerSesion()) window.location.href = "dashboard.html";

    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-login");
      const error = document.getElementById("login-error");
      btn.disabled = true;
      btn.textContent = "Ingresando...";
      error.textContent = "";
      try {
        await iniciarSesion(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        window.location.href = "dashboard.html";
      } catch (err) {
        error.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>
