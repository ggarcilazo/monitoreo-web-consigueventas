<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor ConsigueVentas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="marca">
        <img src="assets/img/logo.png" alt="ConsigueVentas" class="logo">
        <div>
          <h1>Monitor de sitios web</h1>
          <p>Agencia de marketing digital · Estado en tiempo real</p>
        </div>
      </div>
      <div class="acciones-header">
        <span class="usuario" id="usuario-email"></span>
        <button id="btn-chequear-todos">Chequear todos</button>
        <button id="btn-salir" class="secondary">Salir</button>
      </div>   
    </header>

    <div class="resumen">
      <div class="stat" data-estado="todos" title="Ver todos">
        <div class="valor" id="stat-total">—</div>
        <div class="etiqueta">Sitios registrados</div>
      </div>
      <div class="stat stat-ok" data-estado="ok" title="Ver solo disponibles">
        <div class="valor" id="stat-ok">—</div>
        <div class="etiqueta">Disponibles</div>
      </div>
      <div class="stat stat-error" data-estado="error" title="Ver solo caídos">
        <div class="valor" id="stat-caidos">—</div>
        <div class="etiqueta">Caídos</div>
      </div>
    </div>

    <div class="barra">
      <div class="buscador">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="buscador" placeholder="Buscar por nombre o URL..." autocomplete="off">
      </div>
      <div class="filtros">
        <button type="button" class="chip activo" data-estado="todos">Todos</button>
        <button type="button" class="chip" data-estado="ok">Disponibles</button>
        <button type="button" class="chip" data-estado="error">Caídos</button>
      </div>
      <select id="orden" aria-label="Ordenar sitios">
        <option value="nombre">Ordenar: Nombre</option>
        <option value="estado">Ordenar: Caídos primero</option>
        <option value="lento">Ordenar: Más lentos primero</option>
        <option value="ssl">Ordenar: SSL por vencer</option>
      </select>
      <span class="ultimo-chequeo" id="ultimo-chequeo"></span>
    </div>

    <div class="sitios" id="sitios"></div>
  </div>

  <script src="assets/js/auth.js"></script>
  <script>if (!leerSesion()) window.location.href = "login.html";</script>
  <script src="assets/js/dashboard.js"></script></body>
</html>
